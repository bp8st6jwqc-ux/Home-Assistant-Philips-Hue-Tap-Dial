blueprint:
  name: Philips Hue Tap Dial – ZHA
  description: >
    Vier Tasten schalten konfigurierte Leuchten/Schalter oder Szenen.
    Erneutes Drücken schaltet die zugeordneten Leuchten/Schalter aus.
    Das Drehrad dimmt alle aktuell eingeschalteten Leuchten aus den vier
    Tasten-Zuordnungen und den konfigurierten Szenen. Szenen-Mitglieder
    werden automatisch erkannt. Beim erneuten Tastendruck werden die
    zugehörigen Leuchten ausgeschaltet.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    remote:
      name: Philips Hue Tap Dial
      selector:
        device:
          integration: zha
          manufacturer: Signify Netherlands B.V.
          model: RDM002
    button_1_entities:
      name: Taste 1 – Geräte / Leuchten (optional)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch
    button_1_scene:
      name: Taste 1 – Szene (optional)
      default: ""
      selector:
        entity:
          domain: scene
    button_2_entities:
      name: Taste 2 – Geräte / Leuchten (optional)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch
    button_2_scene:
      name: Taste 2 – Szene (optional)
      default: ""
      selector:
        entity:
          domain: scene
    button_3_entities:
      name: Taste 3 – Geräte / Leuchten (optional)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch
    button_3_scene:
      name: Taste 3 – Szene (optional)
      default: ""
      selector:
        entity:
          domain: scene
    button_4_entities:
      name: Taste 4 – Geräte / Leuchten (optional)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch
    button_4_scene:
      name: Taste 4 – Szene (optional)
      default: ""
      selector:
        entity:
          domain: scene

mode: parallel
max: 5
max_exceeded: silent

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote

variables:
  b1: !input button_1_entities
  s1: !input button_1_scene
  b2: !input button_2_entities
  s2: !input button_2_scene
  b3: !input button_3_entities
  s3: !input button_3_scene
  b4: !input button_4_entities
  s4: !input button_4_scene
  scene1_entities: "{{ state_attr(s1, 'entity_id') or [] }}"
  scene2_entities: "{{ state_attr(s2, 'entity_id') or [] }}"
  scene3_entities: "{{ state_attr(s3, 'entity_id') or [] }}"
  scene4_entities: "{{ state_attr(s4, 'entity_id') or [] }}"
  command: "{{ trigger.event.data.command | default('') }}"
  step_mode: "{{ trigger.event.data.args[0] | default(-1) | int(-1) }}"
  step_size: "{{ trigger.event.data.args[1] | default(0) | int(0) }}"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ command == 'button_1_press' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ ((b1 + scene1_entities) | unique | list | count > 0) and (expand(b1 + scene1_entities) | selectattr('state','equalto','on') | list | count > 0) }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ b1 + scene1_entities }}"
              - conditions:
                  - condition: template
                    value_template: "{{ s1 not in ['', none] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ s1 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ b1 | count > 0 }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ b1 }}"
      - conditions:
          - condition: template
            value_template: "{{ command == 'button_2_press' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ ((b2 + scene2_entities) | unique | list | count > 0) and (expand(b2 + scene2_entities) | selectattr('state','equalto','on') | list | count > 0) }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ b2 + scene2_entities }}"
              - conditions:
                  - condition: template
                    value_template: "{{ s2 not in ['', none] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ s2 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ b2 | count > 0 }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ b2 }}"
      - conditions:
          - condition: template
            value_template: "{{ command == 'button_3_press' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ ((b3 + scene3_entities) | unique | list | count > 0) and (expand(b3 + scene3_entities) | selectattr('state','equalto','on') | list | count > 0) }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ b3 + scene3_entities }}"
              - conditions:
                  - condition: template
                    value_template: "{{ s3 not in ['', none] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ s3 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ b3 | count > 0 }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ b3 }}"
      - conditions:
          - condition: template
            value_template: "{{ command == 'button_4_press' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ ((b4 + scene4_entities) | unique | list | count > 0) and (expand(b4 + scene4_entities) | selectattr('state','equalto','on') | list | count > 0) }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ b4 + scene4_entities }}"
              - conditions:
                  - condition: template
                    value_template: "{{ s4 not in ['', none] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ s4 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ b4 | count > 0 }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ b4 }}"
      - conditions:
          - condition: template
            value_template: >
              {{ command == 'step_with_on_off'
                 and step_size > 0 and step_size != 255
                 and (expand(b1 + b2 + b3 + b4 + scene1_entities + scene2_entities + scene3_entities + scene4_entities)
                      | selectattr('entity_id', 'match', '^light[.]')
                      | selectattr('state', 'equalto', 'on')
                      | list | count > 0) }}
        sequence:
          - variables:
              active_lights: "{{ expand(b1 + b2 + b3 + b4 + scene1_entities + scene2_entities + scene3_entities + scene4_entities) | selectattr('entity_id', 'match', '^light[.]') | selectattr('state', 'equalto', 'on') | map(attribute='entity_id') | list }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ step_mode | int(-1) == 0 }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ active_lights }}"
                    data:
                      brightness_step: "{{ (step_size | float * 1.5) | round(0) | int }}"

              - conditions:
                  - condition: template
                    value_template: "{{ step_mode | int(-1) == 1 }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ active_lights }}"
                    data:
                      brightness_step: "{{ 0 - ((step_size | float * 1.5) | round(0) | int) }}"

