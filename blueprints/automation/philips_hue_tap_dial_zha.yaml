blueprint:
  name: Philips Hue Tap Dial – ZHA (4 Tasten + Dimmer)
  description: >
    Steuert vier frei belegbare Tasten mit Licht-/Schalter-Entitäten und optionalen
    Szenen. Ein erneuter Tastendruck schaltet die zugeordneten Entitäten aus.
    Das Drehrad dimmt alle aktuell eingeschalteten, in den vier Tasten-Zielen
    konfigurierten Leuchten. Für Szenen muss zusätzlich das zugehörige Lichtziel
    angegeben werden, damit die Blueprint beim erneuten Drücken ausschalten kann.
  domain: automation
  input:
    remote:
      name: Philips Hue Tap Dial
      description: Das über ZHA eingebundene Tap Dial auswählen.
      selector:
        device:
          integration: zha
    button_1_entities:
      name: Taste 1 – Geräte / Leuchten
      default: []
      selector:
        entity:
          multiple: true
          domain:
            - light
            - switch
    button_1_scene:
      name: Taste 1 – Szene (optional)
      default: ""
      selector:
        entity:
          domain: scene
          multiple: false
    button_2_entities:
      name: Taste 2 – Geräte / Leuchten
      default: []
      selector:
        entity:
          multiple: true
          domain:
            - light
            - switch
    button_2_scene:
      name: Taste 2 – Szene (optional)
      default: ""
      selector:
        entity:
          domain: scene
          multiple: false
    button_3_entities:
      name: Taste 3 – Geräte / Leuchten
      default: []
      selector:
        entity:
          multiple: true
          domain:
            - light
            - switch
    button_3_scene:
      name: Taste 3 – Szene (optional)
      default: ""
      selector:
        entity:
          domain: scene
          multiple: false
    button_4_entities:
      name: Taste 4 – Geräte / Leuchten
      default: []
      selector:
        entity:
          multiple: true
          domain:
            - light
            - switch
    button_4_scene:
      name: Taste 4 – Szene (optional)
      default: ""
      selector:
        entity:
          domain: scene
          multiple: false
    dim_step:
      name: Dimm-Schritt
      description: Helligkeitsänderung pro Drehschritt in Prozent.
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"
          mode: slider

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: zha_event

conditions:
  - condition: template
    value_template: >
      {{ trigger.event.data.device_id == device_id }}

actions:
  - variables:
      device_id: !input remote
      b1: !input button_1_entities
      s1: !input button_1_scene
      b2: !input button_2_entities
      s2: !input button_2_scene
      b3: !input button_3_entities
      s3: !input button_3_scene
      b4: !input button_4_entities
      s4: !input button_4_scene
      step: !input dim_step
      command: "{{ trigger.event.data.command | default('') }}"
      cluster: "{{ trigger.event.data.cluster_id | default(0) | int }}"
      args: "{{ trigger.event.data.args | default([]) }}"
      active_lights: >
        {% set entities = (b1 + b2 + b3 + b4) | unique | list %}
        {{ expand(entities)
           | selectattr('domain', 'equalto', 'light')
           | selectattr('state', 'equalto', 'on')
           | map(attribute='entity_id') | list }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ command in ['button_1_press', 'button_1_short_release'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ b1 | count > 0 and (expand(b1) | selectattr('state','equalto','on') | list | count > 0) }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ b1 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ s1 not in ['', none] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ s1 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ b1 | count > 0 }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ b1 }}"
      - conditions:
          - condition: template
            value_template: "{{ command in ['button_2_press', 'button_2_short_release'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ b2 | count > 0 and (expand(b2) | selectattr('state','equalto','on') | list | count > 0) }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ b2 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ s2 not in ['', none] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ s2 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ b2 | count > 0 }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ b2 }}"
      - conditions:
          - condition: template
            value_template: "{{ command in ['button_3_press', 'button_3_short_release'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ b3 | count > 0 and (expand(b3) | selectattr('state','equalto','on') | list | count > 0) }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ b3 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ s3 not in ['', none] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ s3 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ b3 | count > 0 }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ b3 }}"
      - conditions:
          - condition: template
            value_template: "{{ command in ['button_4_press', 'button_4_short_release'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ b4 | count > 0 and (expand(b4) | selectattr('state','equalto','on') | list | count > 0) }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ b4 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ s4 not in ['', none] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ s4 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ b4 | count > 0 }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ b4 }}"
      - conditions:
          - condition: template
            value_template: "{{ command == 'step' and cluster == 8 and (args | count > 1) and (active_lights | count > 0) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (args[0] | int) == 0 }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ active_lights }}"
                    data:
                      brightness_step_pct: "{{ step }}"
                      transition: 0.2
              - conditions:
                  - condition: template
                    value_template: "{{ (args[0] | int) == 1 }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ active_lights }}"
                    data:
                      brightness_step_pct: "{{ 0 - (step | int) }}"
                      transition: 0.2
